<title>Meuro AI</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: app shell. Phone: one column with a bottom tab bar. Desktop: left rail + content column.
   Meuro green leads; market orange marks food, money and alerts. */
:root{
  --bg:#F3F5EF; --surface:#FFFFFF; --surface-2:#EAEEE6; --ink:#14221A; --muted:#5B6A60; --line:#DAE1D6;
  --green:#2F7D45; --green-ink:#17402A; --green-soft:#DDEEDF; --orange:#E8711F; --orange-soft:#FCE6D3;
  --prot:#2F7D45; --carb:#E8A21F; --fat:#C2532B; --fibre:#4E7FA8; --bad:#C2412B; --good:#2F7D45;
  --shadow:0 1px 2px rgba(20,34,26,.06),0 10px 28px -14px rgba(20,34,26,.22);
  --f-display:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;
  --f-body:"Figtree","Helvetica Neue",Arial,system-ui,sans-serif;
  --r:18px; --r-sm:12px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0D1410; --surface:#151F19; --surface-2:#1C2821; --ink:#ECF2EC; --muted:#A0AFA4; --line:#2A3A30;
  --green:#5DB574; --green-ink:#CFE9D6; --green-soft:#1B3022; --orange:#F2924A; --orange-soft:#3A2416;
  --prot:#5DB574; --carb:#E9B54A; --fat:#E07A52; --fibre:#7FA9CF; --bad:#EF7A63; --good:#5DB574;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 14px 32px -16px rgba(0,0,0,.7); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D1410; --surface:#151F19; --surface-2:#1C2821; --ink:#ECF2EC; --muted:#A0AFA4; --line:#2A3A30;
  --green:#5DB574; --green-ink:#CFE9D6; --green-soft:#1B3022; --orange:#F2924A; --orange-soft:#3A2416;
  --prot:#5DB574; --carb:#E9B54A; --fat:#E07A52; --fibre:#7FA9CF; --bad:#EF7A63; --good:#5DB574;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 14px 32px -16px rgba(0,0,0,.7); color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:16px/1.5 var(--f-body);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
h1,h2,h3,h4{font-family:var(--f-display);font-weight:600;letter-spacing:-.02em;line-height:1.1;margin:0;text-wrap:balance}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--orange);outline-offset:2px;border-radius:8px}
.tnum{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:13.5px}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.11em;text-transform:uppercase;color:var(--green)}

/* shell */
.app{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:100%}
.rail{position:sticky;top:0;height:100vh;padding:24px 16px;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:6px;background:var(--surface)}
.rail .brand{display:flex;align-items:center;gap:10px;padding:4px 10px 18px}
.brand img{height:26px;width:auto}
.brand b{font:600 18px var(--f-display);color:var(--green)}
.navbtn{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;border:0;background:none;cursor:pointer;text-align:left;font-weight:600;color:var(--muted)}
.navbtn svg{width:20px;height:20px;flex:none}
.navbtn[aria-current="page"]{background:var(--green-soft);color:var(--green-ink)}
.navbtn:hover{color:var(--ink)}
.rail .spacer{flex:1}
.main{min-width:0;padding-block:28px 40px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px))}
.inner{max-width:980px;margin:0 auto;display:grid;gap:22px}
.tabbar{display:none}
@media (max-width:860px){
  .app{grid-template-columns:1fr}
  .rail{display:none}
  .main{padding-block:16px 104px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .tabbar{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
  .tabbar .navbtn{flex-direction:column;gap:2px;font-size:11.5px;padding:6px 2px;justify-content:center;align-items:center}
  .tabbar .navbtn.scanbtn svg{width:26px;height:26px}
  .mobilehead{display:flex!important}
}
.mobilehead{display:none;align-items:center;justify-content:space-between;gap:12px}

/* parts */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;box-shadow:var(--shadow);min-width:0}
.card.flat{box-shadow:none}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
@media (max-width:760px){.grid2,.grid3{grid-template-columns:1fr}}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:46px;padding:0 20px;border-radius:999px;border:1px solid transparent;font-weight:600;cursor:pointer;text-decoration:none;white-space:nowrap}
.btn:disabled{opacity:.55;cursor:default}
.btn-primary{background:var(--green);color:#fff}
.btn-orange{background:var(--orange);color:#fff}
.btn-ghost{background:transparent;border-color:var(--line);color:var(--ink)}
.btn-ghost:hover{border-color:var(--ink)}
.btn-sm{height:36px;padding:0 14px;font-size:14px}
.btn-link{background:none;border:0;color:var(--green);font-weight:600;cursor:pointer;padding:0}
.chip{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-size:14px;font-weight:500}
.chip[aria-pressed="true"]{background:var(--green);border-color:var(--green);color:#fff}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:12.5px;font-weight:600;background:var(--surface-2);color:var(--muted)}
.pill.ok{background:var(--green-soft);color:var(--green-ink)}
.pill.warn{background:var(--orange-soft);color:var(--orange)}
.pill.bad{background:color-mix(in srgb,var(--bad) 16%,transparent);color:var(--bad)}
label.field{display:grid;gap:6px;font-weight:600;font-size:14.5px}
.input,select.input,textarea.input{height:46px;border-radius:12px;border:1px solid var(--line);background:var(--surface);padding:0 14px;width:100%;min-width:0}
textarea.input{height:auto;min-height:90px;padding:12px 14px;resize:vertical}
.input:focus{outline:none;border-color:var(--green);box-shadow:0 0 0 3px var(--green-soft)}
.hint{font-weight:400;color:var(--muted);font-size:13px}
.note{padding:12px 14px;border-radius:12px;background:var(--surface-2);font-size:14px;color:var(--muted)}
.note.warn{background:var(--orange-soft);color:var(--ink)}
.err{color:var(--bad);font-size:14px}
.spinner{width:18px;height:18px;border-radius:50%;border:2.5px solid currentColor;border-right-color:transparent;animation:spin .8s linear infinite;display:inline-block}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spinner{animation-duration:3s}}
.thumb{width:56px;height:56px;border-radius:12px;object-fit:cover;flex:none;background:var(--surface-2)}
.empty{padding:22px;border:1.5px dashed var(--line);border-radius:var(--r);text-align:center;color:var(--muted);display:grid;gap:10px;justify-items:center}
table.t{width:100%;border-collapse:collapse;font-size:14.5px}
table.t th,table.t td{padding:9px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
table.t th{font-size:12.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
table.t td.num,table.t th.num{text-align:right}
.scroll-x{overflow-x:auto}

/* onboarding */
.ob{min-height:100%;display:grid;place-items:start center;padding-block:28px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.ob-card{width:min(640px,100%);display:grid;gap:22px}
.progress{height:6px;border-radius:999px;background:var(--surface-2);overflow:hidden}
.progress i{display:block;height:100%;background:var(--green);border-radius:999px;transition:width .3s}
.ob h1{font-size:clamp(28px,4.4vw,40px)}
.ob .q{display:grid;gap:14px}
.ob-foot{display:flex;justify-content:space-between;gap:12px}

/* dashboard */
.hello h1{font-size:clamp(26px,3.6vw,38px)}
.rings{display:grid;grid-template-columns:auto 1fr;gap:22px;align-items:center}
@media (max-width:520px){.rings{grid-template-columns:1fr;justify-items:center}}
.macro{display:grid;gap:6px}
.macro .bar{height:8px;border-radius:999px;background:var(--surface-2);overflow:hidden}
.macro .bar i{display:block;height:100%;border-radius:999px}
.bigscan{display:flex;gap:16px;align-items:center;justify-content:space-between;background:var(--green);color:#fff;border-radius:var(--r);padding:20px;border:0;cursor:pointer;text-align:left;width:100%}
.bigscan b{font:600 20px var(--f-display)}
.bigscan span{opacity:.88;font-size:14px}
.bigscan .ico{width:52px;height:52px;border-radius:16px;background:rgba(255,255,255,.18);display:grid;place-items:center;flex:none}
.meal{display:flex;gap:14px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--line)}
.meal:last-child{border-bottom:0}
.meal .body{flex:1;min-width:0;display:grid;gap:4px}
.meal .slot{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--orange)}
.meal h4{font-size:17px}
.kv{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13.5px;color:var(--muted)}
.kv b{color:var(--ink);font-weight:600}
details.more{border-top:1px solid var(--line);margin-top:6px;padding-top:6px}
details.more summary{cursor:pointer;font-weight:600;color:var(--green);font-size:14px}
.chart svg{width:100%;height:auto;display:block}

/* scanner */
.scanwrap{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:20px;align-items:start}
@media (max-width:860px){.scanwrap{grid-template-columns:1fr}}
.drop{border:2px dashed var(--line);border-radius:var(--r);min-height:280px;display:grid;place-items:center;text-align:center;padding:20px;background:var(--surface);position:relative;overflow:hidden}
.drop.has img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.drop.drag{border-color:var(--green);background:var(--green-soft)}
.conf{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600}
.conf i{width:34px;height:6px;border-radius:999px;background:var(--surface-2);overflow:hidden;display:inline-block}
.conf i b{display:block;height:100%;background:var(--green)}
.item-row{display:grid;grid-template-columns:minmax(0,1fr) 110px 34px;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.item-row .grams{display:flex;align-items:center;gap:4px}
.item-row .grams input{height:38px;text-align:right;padding:0 8px}
.icon-btn{width:34px;height:34px;border-radius:10px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;cursor:pointer;color:var(--muted)}

/* chat */
.chat{display:grid;grid-template-rows:1fr auto;min-height:min(70vh,640px)}
.msgs{display:flex;flex-direction:column;gap:12px;overflow:auto;padding-bottom:10px;max-height:min(62vh,560px)}
.msg{max-width:min(620px,88%);padding:12px 16px;border-radius:18px;white-space:pre-wrap;line-height:1.5}
.msg.me{align-self:flex-end;background:var(--green);color:#fff;border-bottom-right-radius:6px}
.msg.ai{align-self:flex-start;background:var(--surface);border:1px solid var(--line);border-bottom-left-radius:6px}
.composer{display:flex;gap:8px;padding-top:10px;border-top:1px solid var(--line)}
.suggest{display:flex;flex-wrap:wrap;gap:8px}

/* pros */
.pro{display:grid;gap:10px}
.avatar{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;color:#fff;font-weight:700;background:var(--green);flex:none}
.modal{position:fixed;inset:0;z-index:40;background:rgba(10,16,12,.5);display:grid;place-items:center;padding:16px}
.modal .card{width:min(560px,100%);max-height:90vh;overflow:auto}
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-weight:600;font-size:14px;z-index:50}
@media (min-width:861px){.toast{bottom:28px}}
.gate{min-height:100%;display:grid;place-items:center;padding:24px max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px));text-align:center}
.gate .card{max-width:520px;display:grid;gap:14px;justify-items:center}
.sec-title{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.sec-title h2{font-size:22px}
</style>

<div id="root"><div class="gate"><div class="card"><span class="spinner" style="color:var(--green)"></span><p class="muted">Opening Meuro AI…</p></div></div></div>
<div id="toast" class="toast" hidden role="status"></div>

<script>

/* Ingredients for planning: nutrients per 100 g as bought; price per gram in Lagos (naira).
   Prices: Lagos State price tracker & Lagos market surveys, Oct 2026; others are Meuro estimates (est). */
const INGR={

/* ---------------- targets (the personalised nutrition profile) ---------------- */
function ageOf(p){if(p.age)return +p.age;return 30;}
function targets(p){
  if(!p)return null;
  const w=+p.weight||70,h=+p.height||170,a=ageOf(p);
  const bmr=10*w+6.25*h-5*a+(p.sex==="female"?-161:p.sex==="male"?5:-78);
  const act=(ACT.find(x=>x[0]===p.activity)||ACT[1])[2];
  let kcal=bmr*act;
  const g=p.goals||[];
  if(g.includes("lose"))kcal-=Math.min(500,kcal*.18);
  if(g.includes("muscle"))kcal+=250;
  kcal=Math.max(p.sex==="female"?1300:1500,Math.round(kcal/10)*10);
  const protPerKg=g.includes("muscle")?1.5:(g.includes("lose")?1.2:1.0);
  let prot=Math.round(w*protPerKg);
  const cond=p.conditions||[];
  const kidney=cond.includes("kidney");
  if(kidney)prot=Math.round(w*.8);
  const fat=Math.round(kcal*.3/9);
  const carb=Math.max(0,Math.round((kcal-prot*4-fat*9)/4));
  const sodium=cond.includes("hypertension")||cond.includes("heart")||kidney?1500:2000;
  const sugar=Math.round(kcal*.1/4);
  const bmi=w/((h/100)**2);
  const review=cond.some(c=>["diabetes","kidney","heart"].includes(c))||p.meds==="yes"||p.doctorDiet==="yes";
  return {k:kcal,p:prot,c:carb,f:fat,fb:p.sex==="female"?25:30,s:sugar,na:sodium,bmi:r1(bmi),bmr:Math.round(bmr),review};
}
function bmiLabel(b){return b<18.5?"below the healthy range":b<25?"in the healthy range":b<30?"above the healthy range":"well above the healthy range";}
function profileText(p){
  const t=targets(p);const cond=(p.conditions||[]).map(c=>(CONDITIONS.find(x=>x[0]===c)||[c,c])[1]).concat(p.otherCondition?[p.otherCondition]:[]);
  return [
    `Name: ${p.name}. Age: ${ageOf(p)}. Sex: ${p.sex||"not given"}. Location: ${p.city||""} ${p.country||""}.`,
    `Height ${p.height} cm, weight ${p.weight} kg (BMI ${t.bmi}, ${bmiLabel(t.bmi)}).`,
    `Health conditions: ${cond.length?cond.join(", "):"none reported"}. Prescribed medication: ${p.meds||"not said"}. Following a doctor's diet: ${p.doctorDiet||"not said"}.`,
    `Allergies/intolerances: ${p.allergies||"none"}. Dietary pattern: ${p.diet||"no restriction"}.`,
    `Goals: ${(p.goals||[]).map(g=>(GOALS.find(x=>x[0]===g)||[g,g])[1]).join(", ")||"healthy eating"}.`,
    `Likes: ${p.likes||"-"}. Dislikes: ${p.dislikes||"-"}. Cuisines: ${p.cuisines||"Nigerian"}.`,
    `Food budget: ${naira(p.budget)} per ${p.budgetPeriod||"week"} (≈ ${naira(dailyBudget(p))} per day) for ${p.people||1} person(s). Shops at: ${p.shopsAt||"market"}.`,
    `Activity: ${(ACT.find(x=>x[0]===p.activity)||ACT[1])[1]}. Meals per day: ${p.mealsPerDay||3}. Cooks: ${p.cooking||"sometimes"}.`,
    `Daily guide targets (estimates): ${t.k} kcal, protein ${t.p} g, carbs ${t.c} g, fat ${t.f} g, fibre ${t.fb} g, sugar under ${t.s} g, sodium under ${t.na} mg.`
  ].join("\n");
}
function dailyBudget(p){const b=+p.budget||0;return p.budgetPeriod==="day"?b:p.budgetPeriod==="month"?b/30:b/7;}

/* ---------------- boot ---------------- */
async function boot(){
  const [db,user,sample]=await Promise.all([claude.use("db"),claude.use("user"),claude.use("sample")]).catch(()=>[null,null,null]);
  S.db=db;S.user=user;S.sample=sample;
  if(user){try{S.uid=await user.id();S.me=await user.me();S.isOwner=await user.isOwner();S.canEdit=await user.canEdit();}catch(e){}}
  try{const v=localStorage.getItem("meuro.view");if(v)S.view=v;}catch(e){}
  if(!db||!S.uid){renderGate();return;}
  S.dbOk=true;
  const mine=db.collection("data/users/"+S.uid);
  let first=true;const timer=setTimeout(()=>{if(first){first=false;render();}},10000);
  try{
    const pr=await mine.doc("profile").get();S.profile=pr.exists?pr.data():null;
    const pl=await mine.doc("plan").get();S.plan=pl.exists?pl.data():null;
    const ch=await mine.doc("chat").get();if(ch.exists){S.chat=(ch.data().turns||[]).slice();S.chatSave=ch.data().save!==false;}
  }catch(e){}
  clearTimeout(timer);first=false;
  mine.where("kind","==","diary").onSnapshot(snap=>{S.diary=snap.docs.map(d=>Object.assign({id:d.id},d.data()));if(S.profile)render();},()=>{});
  db.collection("pros").onSnapshot(snap=>{S.pros=snap.docs.map(d=>Object.assign({id:d.id},d.data()));if(S.view==="pros"||S.view==="home")render();},()=>{});
  db.doc("applications/"+S.uid).onSnapshot(d=>{S.myApp=d.exists?d.data():null;if(S.view==="pros")render();},()=>{});
  db.doc("consults/"+S.uid).onSnapshot(d=>{S.myConsult=d.exists?d.data():null;if(S.view==="pros")render();},()=>{});
  if(S.canEdit){
    db.collection("applications").onSnapshot(s=>{S.apps=s.docs.map(d=>Object.assign({id:d.id},d.data()));if(S.view==="admin")render();},()=>{});
    db.collection("consults").onSnapshot(s=>{S.consults=s.docs.map(d=>Object.assign({id:d.id},d.data()));if(S.view==="admin")render();},()=>{});
  }
  render();
}

function diaryFor(day){return S.diary.filter(x=>x.day===day);}
function ring(val,max,size,color,label,sub){
  const r=size/2-9,c=2*Math.PI*r,pct=Math.max(0,Math.min(1,val/(max||1)));
  return `<svg viewBox="0 0 ${size} ${size}" width="${size}" height="${size}" role="img" aria-label="${esc(label)} ${r0(val)} of ${r0(max)}">
    <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="var(--surface-2)" stroke-width="12"/>
    <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${color}" stroke-width="12" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${c*(1-pct)}" transform="rotate(-90 ${size/2} ${size/2})"/>
    <text x="50%" y="47%" text-anchor="middle" font-family="var(--f-display)" font-size="${size/6}" font-weight="600" fill="var(--ink)">${r0(val).toLocaleString()}</text>
    <text x="50%" y="62%" text-anchor="middle" font-size="12" fill="var(--muted)">${esc(sub)}</text></svg>`;
}
function macroBars(tot,t){
  return [["p","Protein","var(--prot)","g"],["c","Carbs","var(--carb)","g"],["f","Fat","var(--fat)","g"],["fb","Fibre","var(--fibre)","g"],["na","Sodium","var(--orange)","mg"]].map(([k,l,col,u])=>{
    const over=k==="na"?tot[k]>t[k]:false;const pct=Math.min(100,tot[k]/(t[k]||1)*100);
    return `<div class="macro"><div class="row between small"><b>${l}</b><span class="tnum ${over?"err":"muted"}">${r0(tot[k])} / ${t[k]} ${u}${k==="na"?" max":""}</span></div><div class="bar"><i style="width:${pct}%;background:${over?"var(--bad)":col}"></i></div></div>`;}).join("");
}
function weekChart(t){
  const days=[...Array(7)].map((_,i)=>{const d=new Date();d.setDate(d.getDate()-6+i);return todayKey(d);});
  const vals=days.map(k=>sumN(diaryFor(k)).k);
  const W=560,H=190,pad=34,max=Math.max(t.k*1.25,...vals,100),bw=(W-pad*2)/7*.56;
  const y=v=>H-26-(v/max)*(H-50);
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Calories each day this week">`;
  [0,.5,1].forEach(f=>{const v=Math.round(max*f/100)*100;s+=`<line x1="${pad}" x2="${W-8}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${pad-6}" y="${y(v)+4}" text-anchor="end" font-size="11" fill="var(--muted)">${v}</text>`;});
  s+=`<line x1="${pad}" x2="${W-8}" y1="${y(t.k)}" y2="${y(t.k)}" stroke="var(--orange)" stroke-dasharray="5 5"/><text x="${W-8}" y="${y(t.k)-6}" text-anchor="end" font-size="11" fill="var(--orange)">guide ${t.k}</text>`;
  days.forEach((k,i)=>{const x=pad+(W-pad*2)/7*(i+.5)-bw/2,v=vals[i];
    s+=`<rect x="${x}" y="${y(v)}" width="${bw}" height="${Math.max(0,H-26-y(v))}" rx="6" fill="${k===todayKey()?"var(--green)":"color-mix(in srgb,var(--green) 45%,var(--surface-2))"}"/>`;
    s+=`<text x="${x+bw/2}" y="${H-8}" text-anchor="middle" font-size="11" fill="var(--muted)">${new Date(k+"T12:00:00").toLocaleDateString("en-GB",{weekday:"short"})}</text>`;
    if(v)s+=`<text x="${x+bw/2}" y="${y(v)-6}" text-anchor="middle" font-size="11" fill="var(--ink)">${r0(v)}</text>`;});
  return s+"</svg>";
}

function mealThumb(m){const d=m.dishKey&&DISHES[m.dishKey];return d&&d.img?`<img class="thumb" src="img/${d.img}.webp" alt="">`:`<div class="thumb" style="display:grid;place-items:center;color:var(--green);font:600 18px var(--f-display)">${esc(initials(m.name))}</div>`;}

/* =====================================================================
   MEAL PLANNER — Claude composes meals from the ingredient table; the page
   computes cost and nutrients from that table and enforces the budget.
   ===================================================================== */
function ingrTable(){return Object.entries(INGR).map(([k,v])=>`${k} | ${v.n} | ₦${v.ppg}/g | per100g: ${v.k}kcal P${v.p} C${v.c} F${v.f} fibre${v.fb} Na${v.na}mg`).join("\n");}
function costMeal(m,people){
  const items=(m.ingredients||[]).filter(x=>INGR[x.key]&&+x.grams>0);
  const nut=sumN(items.map(x=>nutFor(INGR[x.key],+x.grams)));
  const cost=items.reduce((a,x)=>a+INGR[x.key].ppg*(+x.grams),0)*people;
  return {nut,cost,items};
}
function finishPlan(raw,days,p){
  const people=+p.people||1;
  const outDays=(raw.days||[]).slice(0,days).map((d,i)=>{const meals=(d.meals||[]).map(m=>{const c=costMeal(m,people);return Object.assign({},m,{ingredients:c.items,nut:c.nut,cost:c.cost,dishKey:DISHES[m.dishKey]?m.dishKey:null});});
    return {label:d.label||("Day "+(i+1)),meals,cost:meals.reduce((a,m)=>a+m.cost,0),nut:sumN(meals.map(m=>m.nut))};});
  const total=outDays.reduce((a,d)=>a+d.cost,0);
  const budgetForPeriod=dailyBudget(p)*outDays.length;
  return {days:outDays,total,dayCostAvg:total/(outDays.length||1),budgetForPeriod,within:total<=budgetForPeriod*1.001,createdAt:new Date().toISOString(),note:raw.note||""};
}
async function makePlan(days,feedback){
  const p=S.profile,t=targets(p),people=+p.people||1;
  const perDay=dailyBudget(p);
  const prompt=`You are Meuro AI's meal planner, an evidence-based nutrition assistant for African households. Build a practical ${days}-day meal plan.

USER PROFILE
${profileText(p)}

HARD RULES
- Use ONLY ingredient keys from the table below, with grams PER PERSON (raw, as bought). The app computes cost and nutrients from these grams, so be realistic about portions.
- Daily food cost for ${people} person(s) = sum(grams × price per gram) × ${people}. It MUST be at most ₦${Math.round(perDay)} per day. Aim for 85–100% of it. Cheaper is fine; over budget is not.
- ${p.mealsPerDay==="2"?"2 meals a day (brunch and dinner, use slots lunch and dinner)":p.mealsPerDay==="4"?"breakfast, lunch, dinner and one snack":"breakfast, lunch and dinner"}.
- Respect allergies, dislikes, dietary pattern and health conditions. Hypertension/heart/kidney: little salt, no seasoning cubes, limit sodium to ${t.na} mg/day. Diabetes: favour fibre, beans, vegetables, controlled starch portions, no sugary drinks. Kidney: moderate protein.
- Aim near ${t.k} kcal and ${t.p} g protein per person per day.
- Use Nigerian/West African meals the user would actually eat (${p.likes||"local favourites"}), with variety across days. Use 5–20 g oil per person per meal at most.
- If dishKey matches the meal, set it from this list, else null: ${Object.keys(DISHES).join(", ")}.
- Never claim food cures or treats disease.${feedback?"\n- "+feedback:""}

INGREDIENT TABLE (key | name | price | nutrients)
${ingrTable()}

Return ONLY JSON:
{"days":[{"label":"Day 1","meals":[{"slot":"breakfast|lunch|dinner|snack","name":"string","dishKey":"string|null","ingredients":[{"key":"rice","grams":90}],"steps":["short step", "..."],"why":"one sentence on why this suits the user"}]}],"note":"one sentence about the plan"}`;
  const raw=await S.sample.json(prompt,{modelTier:"default",cache:false});
  return finishPlan(raw,days,p);
}

async function runPlan(days,feedback){
  if(!S.sample){S.planErr="Meuro AI is not available in this view.";return render();}
  S.busy.plan=String(days);S.planErr="";render();
  try{const pl=await makePlan(days,feedback);
    if(!pl.days.length)throw {code:"empty"};
    if(!pl.within&&!feedback){S.busy.plan=String(days);render();const again=await makePlan(days,`Your first attempt cost ₦${Math.round(pl.total)}, above the ₦${Math.round(pl.budgetForPeriod)} limit. Reduce quantities of the most expensive ingredients so the total fits.`);if(again.total<pl.total)Object.assign(pl,again);}
    S.plan=pl;await mineDoc("plan").set(JSON.parse(JSON.stringify(pl)));toast(pl.within?"Plan ready, within budget":"Plan ready, but over budget");}
  catch(e){S.planErr=e&&e.code==="not_granted"?"Meuro AI needs your permission to plan. Allow it when asked.":e&&e.code==="rate_limited"?"Meuro AI is busy. Wait a minute and try again.":"Meuro AI could not build a plan this time. Try again.";}
  S.busy.plan=null;render();
}

async function swapMeal(di,mi){

  const left=Math.max(200,dailyBudget(p)-others);
  S.busy.swap=di+"-"+mi;render();
  try{const raw=await S.sample.json(`You are Meuro AI's meal planner. Replace this ${m.slot} ("${m.name}") with a different, practical meal.
USER PROFILE
${profileText(p)}
Rules: use ONLY these ingredient keys with grams per person; cost for ${p.people} person(s) must be ≤ ₦${Math.round(left)}; respect health conditions and dislikes; dishKey from [${Object.keys(DISHES).join(", ")}] or null.
INGREDIENTS
${ingrTable()}
Return ONLY JSON: {"slot":"${m.slot}","name":"","dishKey":null,"ingredients":[{"key":"","grams":0}],"steps":[""],"why":""}`,{modelTier:"default",cache:false});
    const c=costMeal(raw,+p.people||1);
    pl.days[di].meals[mi]=Object.assign({},raw,{slot:m.slot,ingredients:c.items,nut:c.nut,cost:c.cost,dishKey:DISHES[raw.dishKey]?raw.dishKey:null});
    const d=pl.days[di];d.cost=d.meals.reduce((a,x)=>a+x.cost,0);d.nut=sumN(d.meals.map(x=>x.nut));
    pl.total=pl.days.reduce((a,x)=>a+x.cost,0);pl.dayCostAvg=pl.total/pl.days.length;pl.within=pl.total<=pl.budgetForPeriod*1.001;

  catch(e){toast("Could not replace the meal. Try again.");}
  S.busy.swap=null;render();
}

function setScanFile(f){

async function analyse(){
  const sc=S.scan;if(!sc||!sc.blob)return;

  const lim=await S.sample.limits().catch(()=>null);

  S.busy.scan=true;sc.err="";render();
  const keys=Object.entries(DISHES).map(([k,v])=>`${k}: ${v.n}`).join("; ");
  const prompt=`You are Meuro AI's food recognition step. The image is a photo of a meal the user is about to eat (often Nigerian/West African).
List every distinct food component you can see. For each: the best matching key from this food table (or null if none fits), a short name, the estimated cooked weight in grams on the plate (use plate size, spoon or hand for scale), and your confidence 0–1. If the key is null, also give your own per-100 g estimate.

If the photo does not show food, return {"isFood":false}.
Return ONLY JSON: {"isFood":true,"meal":"short name for the whole plate","items":[{"key":"jollof","name":"Jollof rice","grams":250,"confidence":0.8,"per100":null}],"notes":"what you could not tell, e.g. amount of oil","overall":0.7}

  S.busy.scan=false;render();
}

function trendChart(days,t){
  const W=600,H=200,pad=36;const vals=days.map(k=>sumN(diaryFor(k).map(x=>x.nut)));
  const maxK=Math.max(t.k*1.3,...vals.map(v=>v.k),100);
  const x=i=>pad+(W-pad-10)*(days.length===1?0:i/(days.length-1)),y=v=>H-24-(v/maxK)*(H-44);
  const pts=vals.map((v,i)=>`${x(i)},${y(v.k)}`).join(" ");
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Calories per day">`;
  [0,.5,1].forEach(f=>{const v=Math.round(maxK*f/100)*100;s+=`<line x1="${pad}" x2="${W-10}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${pad-6}" y="${y(v)+4}" font-size="11" text-anchor="end" fill="var(--muted)">${v}</text>`;});
  s+=`<line x1="${pad}" x2="${W-10}" y1="${y(t.k)}" y2="${y(t.k)}" stroke="var(--orange)" stroke-dasharray="5 5"/>`;
  s+=`<polygon points="${x(0)},${H-24} ${pts} ${x(days.length-1)},${H-24}" fill="color-mix(in srgb,var(--green) 16%,transparent)"/><polyline points="${pts}" fill="none" stroke="var(--green)" stroke-width="2.5" stroke-linejoin="round"/>`;
  vals.forEach((v,i)=>{if(v.k)s+=`<circle cx="${x(i)}" cy="${y(v.k)}" r="3.5" fill="var(--green)"/>`;});
  const step=days.length>10?7:1;days.forEach((k,i)=>{if(i%step===0||i===days.length-1)s+=`<text x="${x(i)}" y="${H-6}" font-size="11" text-anchor="middle" fill="var(--muted)">${new Date(k+"T12:00:00").toLocaleDateString("en-GB",days.length>10?{day:"numeric",month:"short"}:{weekday:"short"})}</text>`;});
  return s+"</svg>";
}

function assistantRules(){
  const p=S.profile,t=targets(p),today=diaryFor(todayKey()),tot=sumN(today.map(x=>x.nut));
  const week=[...Array(7)].map((_,i)=>{const d=new Date();d.setDate(d.getDate()-6+i);const k=todayKey(d);const s=sumN(diaryFor(k).map(x=>x.nut));return `${k}: ${r0(s.k)} kcal, P${r0(s.p)} C${r0(s.c)} F${r0(s.f)} fibre${r1(s.fb)} Na${r0(s.na)}mg (${diaryFor(k).map(x=>x.name).join("; ")||"nothing logged"})`;}).join("\n");
  const plan=S.plan?S.plan.days.map(d=>d.label+": "+d.meals.map(m=>`${m.slot} ${m.name} (${r0(m.nut.k)} kcal, ${naira(m.cost)})`).join("; ")).join("\n"):"No plan yet.";
  return `You are Meuro AI, a warm, evidence-based nutrition assistant inside the Meuro app, built for African users. Answer in plain, friendly English (short paragraphs or short lists, no markdown headings), use local foods and naira prices, and explain WHY you recommend something.
Safety: you give nutrition information, not medical care. Never diagnose, never prescribe or tell someone to stop or change medication, never claim food cures disease. If the user mentions emergency symptoms (chest pain, trouble breathing, fainting, very high or low blood sugar symptoms, signs of stroke, severe allergic reaction), tell them to get emergency medical care immediately. For complex medical diets (kidney disease, insulin use, pregnancy complications) recommend a registered dietitian or doctor and mention the Experts tab.
Typical Lagos prices (Oct 2026): rice ₦1,100/kg, beans ₦1,800/kg, garri ~₦600/kg, eggs ₦1,080 for 6, tomatoes ₦2,000/kg, chicken ~₦6,500/kg, fish ~₦6,000/kg, plantain ₦400 each, ugu ₦500 a bunch.
USER PROFILE
${profileText(p)}
TODAY SO FAR: ${r0(tot.k)} kcal, protein ${r0(tot.p)} g, carbs ${r0(tot.c)} g, fat ${r0(tot.f)} g, fibre ${r1(tot.fb)} g, sodium ${r0(tot.na)} mg.
LAST 7 DAYS
${week}
CURRENT MEAL PLAN
${plan}`;
}
function viewAsk(el){
  const turns=S.chat;

  const cl=$("#clear");if(cl)cl.onclick=async()=>{S.chat=[];await mineDoc("chat").set({save:S.chatSave,turns:[]});render();};

async function ask(q){
  if(S.busy.ask)return;
  if(!S.sample){toast("Meuro AI is not available in this view.");return;}
  S.chat.push({role:"user",content:q});S.busy.ask=true;render();
  const msgs=$("#msgs");const bubble=document.createElement("div");bubble.className="msg ai";bubble.textContent="Thinking…";msgs.appendChild(bubble);msgs.scrollTop=msgs.scrollHeight;
  const history=S.chat.slice(-12);
  try{
    const {text}=await S.sample([{role:"user",content:assistantRules()+"\n\nReply to the conversation that follows."},{role:"assistant",content:"Understood. I'll use your profile, diary and plan, and keep advice safe and practical."},...history],{cache:false,onText:({text})=>{bubble.textContent=text;msgs.scrollTop=msgs.scrollHeight;}});
    S.chat.push({role:"assistant",content:text});
    if(S.chatSave)await mineDoc("chat").set({save:true,turns:S.chat.slice(-30)});
  }catch(e){S.chat.pop();toast(e&&e.code==="not_granted"?"Allow Meuro AI when asked to get answers.":e&&e.code==="rate_limited"?"Meuro AI is busy. Try again in a minute.":"No answer this time. Try again.");}
  S.busy.ask=false;render();
}

  el.querySelectorAll("[data-reject]").forEach(b=>b.onclick=async()=>{const a=S.apps.find(x=>x.id===b.dataset.reject);
    await S.db.doc("applications/"+a.id).set(Object.assign(strip(a),{status:"rejected",reviewNote:"We could not verify your licence. Reply to the Meuro team with your registration details.",reviewedAt:new Date().toISOString()}));toast("Application rejected");});
  el.querySelectorAll("[data-unlist]").forEach(b=>b.onclick=async()=>{await S.db.doc("pros/"+b.dataset.unlist).delete();const a=S.apps.find(x=>x.id===b.dataset.unlist);await S.db.doc("applications/"+a.id).set(Object.assign(strip(a),{status:"rejected",reviewNote:"Removed from the directory."}));toast("Removed from directory");});
  const setStatus=async(key,status)=>{const [uid,id]=key.split("|");const c=S.consults.find(x=>x.id===uid);const list=(c.requests||[]).map(r=>r.id===id?Object.assign({},r,{status,reply:status==="scheduled"?"The Meuro team will contact you to confirm the time.":"The Meuro team could not arrange this request. Please send a new one."}):r);await S.db.doc("consults/"+uid).set({requests:list,updatedAt:new Date().toISOString()});toast(status==="scheduled"?"Marked scheduled":"Declined");};
  el.querySelectorAll("[data-sched]").forEach(b=>b.onclick=()=>setStatus(b.dataset.sched,"scheduled"));
  el.querySelectorAll("[data-decline]").forEach(b=>b.onclick=()=>setStatus(b.dataset.decline,"declined"));
}

function viewProfile(el){
  const p=S.profile,t=targets(p);
  el.innerHTML=`<div style="display:grid;gap:18px">
    <div><span class="eyebrow">My profile</span><h2 style="font-size:28px;margin-top:4px">${esc(p.name)}</h2></div>
    <section class="card"><h3>Your nutrition profile</h3><pre class="small" style="white-space:pre-wrap;font-family:var(--f-body);margin:10px 0 0">${esc(profileText(p))}</pre>
      <div class="row" style="margin-top:14px"><button class="btn btn-primary" id="redo">Update my answers</button></div></section>
    <section class="card"><h3>Privacy & your data</h3><p class="small muted" style="margin:8px 0 12px">Your profile, meal plans, diary and saved conversations are stored in your private space in Meuro. Only you can read them. Consultation requests are shared with the Meuro team and the professional you chose, only if you ticked "share".</p>
      <button class="btn btn-ghost" id="wipe" style="color:var(--bad);border-color:var(--bad)">Delete all my Meuro data</button><p class="small err" id="wipe-msg"></p></section>
  </div>`;
  $("#redo").onclick=()=>{S.ob={step:1,data:Object.assign({},p)};S.editing=true;render();};
  $("#wipe").onclick=async e=>{const b=e.target;if(!b.dataset.confirm){b.dataset.confirm=1;b.textContent="Tap again to permanently delete everything";$("#wipe-msg").textContent="This deletes your profile, plans, diary and conversations. It cannot be undone.";return;}
    b.disabled=true;const col=S.db.collection("data/users/"+S.uid);
    try{const all=await col.get();for(const d of all.docs)await col.doc(d.id).delete();await S.db.doc("consults/"+S.uid).delete().catch(()=>{});
      S.profile=null;S.plan=null;S.diary=[];S.chat=[];S.ob={step:0,data:{}};toast("Your data was deleted");render();}
    catch(x){b.disabled=false;$("#wipe-msg").textContent="Could not delete everything. Try again.";}};
}
